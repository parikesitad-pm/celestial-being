# Celestial Being lockscreen — art is pre-composed, so no blur on the background
general { hide_cursor = true; ignore_empty_input = true }

background {
    monitor =
    path = ~/.local/share/hyprlock-frames/frame-0.jpg
    blur_passes = 0
    brightness = 0.9
    # Frames carry the scrim and one beam flare each; see scripts/lock-frames.sh
    reload_cmd = ~/.config/hypr/scripts/lock-background.sh
    reload_time = 4
    crossfade_time = 3.2
}

image {
    monitor =
    path = ~/Pictures/avatar.jpg
    size = 120
    rounding = -1
    border_size = 3
    border_color = rgba(2ee6a8ff) rgba(3b82f6ff) 45deg
    position = 0, 330
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] echo "$(date +'%A, %d %B')"
    color = rgba(e8f1ffcc)
    font_size = 20
    font_family = Inter
    position = 0, 270
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:200] ~/.config/hypr/scripts/lock-clock.sh
    color = rgba(ffffffff)
    # Points, not pixels: 72 pt renders the same 96 px clock as the SDDM theme.
    font_size = 72
    font_family = Inter Bold
    shadow_passes = 2
    shadow_size = 6
    position = 0, 160
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(2ee6a8ff) rgba(3b82f6ff) rgba(a855f7ff) 45deg
    inner_color = rgba(070b14b0)
    font_color = rgba(e8f1ffff)
    check_color = rgba(ff9f1cff) rgba(2ee6a8ff) 120deg
    fail_color = rgba(ff4d6dff) rgba(a855f7ff) 120deg
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <i>dap_</i>
    fail_text = <i>$FAIL</i>
    rounding = 26
    shadow_passes = 2
    position = 0, 70
    halign = center
    valign = bottom
}

label {
    monitor =
    text = d-ap.my.id
    color = rgba(e8f1ff77)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 24
    halign = center
    valign = bottom
}

animations {
    enabled = true
    bezier = mac, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 7, mac
    animation = fadeOut, 1, 4, mac
    animation = inputFieldDots, 1, 2, mac
    animation = inputFieldFade, 1, 3, mac
    animation = inputFieldWidth, 1, 3, mac
    animation = inputFieldColors, 1, 3, mac
}
