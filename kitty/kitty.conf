# dap_ // d-ap.my.id — cyberpunk neon kitty
font_family      JetBrainsMono Nerd Font
# swap to Fira Code by uncommenting:
# font_family    FiraCode Nerd Font
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD FiraCode Nerd Font   # icon fallback
font_size        10
adjust_line_height 105%

# GPU-rendered, frame-synced, low latency
sync_to_monitor yes
repaint_delay   6
input_delay     1
disable_ligatures never

background_opacity 0.95
background_blur    24
window_padding_width 10 12
hide_window_decorations yes
confirm_os_window_close 0
cursor_shape beam
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
macos_option_as_alt yes
copy_on_select clipboard
enable_audio_bell no
scrollback_lines 20000
shell /usr/bin/zsh

tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #0b0615
active_tab_background   #00f0ff
inactive_tab_foreground #9d8fc4
inactive_tab_background #1a1033

# Mac-style shortcuts (⌘ = super)
map super+t new_tab
map super+shift+t new_tab
map super+d launch --location=vsplit
map super+shift+d launch --location=hsplit
map super+c copy_to_clipboard
map super+shift+v paste_from_clipboard
map super+equal change_font_size all +1.0
map super+minus change_font_size all -1.0
map super+0     change_font_size all 0

# Neon palette
foreground #d6f7ff
background #0b0615
selection_foreground #0b0615
selection_background #00f0ff
cursor #ff2e97
cursor_text_color #0b0615
url_color #00f0ff
active_border_color #ff2e97
inactive_border_color #2a1a4a

color0  #1a1033
color8  #5b4a86
color1  #ff2e97
color9  #ff6ac1
color2  #39ff14
color10 #7dff5c
color3  #fcee0a
color11 #fff86b
color4  #9d4edd
color12 #c084fc
color5  #ff00ff
color13 #ff7bff
color6  #00f0ff
color14 #7ffbff
color7  #d6f7ff
color15 #ffffff

# splits layout (needed for the vsplit/hsplit maps above), clean copies, long-command notice
enabled_layouts         splits,stack
map ctrl+shift+m        toggle_layout stack
strip_trailing_spaces   smart
notify_on_cmd_finish    unfocused 10.0

# window, cursor and tab look; colors stay neon
placement_strategy      center
remember_window_size    yes
initial_window_width    900
initial_window_height   560
cursor_beam_thickness   1.8
cursor_blink_interval   -1
mouse_hide_wait         3.0
tab_bar_edge            top
tab_bar_margin_height   4.0 0.0
active_tab_font_style   bold
tab_title_template      "{index}: {title[:30]}"
undercurl_style         thick-sparse
